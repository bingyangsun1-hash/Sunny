<style>
  :root {
    --bg: #faf8f4;
    --card: #ffffff;
    --border: #e8e2d6;
    --text: #2b2620;
    --muted: #938a7a;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    grid-auto-rows: 220px;
    gap: 14px;
  }

  .cell {
    border-radius: 6px; overflow: hidden; position: relative;
    background: var(--card); border: 1px solid var(--border);
    cursor: zoom-in;
  }
  .cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    -webkit-user-drag: none; user-select: none;
    transition: transform .25s ease;
  }
  .cell:hover img { transform: scale(1.04); }

  .title-cell {
    cursor: default; background: transparent; border: none;
    display: flex; flex-direction: column; justify-content: center;
    gap: 10px; padding: 26px;
  }
  .title-mark { line-height: 1; }
  .title-mark svg { width: 38px; height: 38px; display: block; }
  .title-text { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .title-text-en { font-size: 13px; color: var(--muted); letter-spacing: .04em; margin-top: -4px; }

  .state-cell {
    grid-column: 1 / -1;
    cursor: default; background: transparent; border: none;
    display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); font-size: 14px; line-height: 1.9;
  }
  .state-cell code {
    background: var(--card); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 5px; font-size: 13px;
  }

  /* ── Lightbox ── */
  .lb {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(20,17,12,.94);
    align-items: center; justify-content: center;
  }
  .lb.open { display: flex; }
  .lb-img {
    width: min(92vw, 1100px); height: min(86vh, 900px);
    background-position: center; background-repeat: no-repeat; background-size: contain;
    pointer-events: none;
  }
  .lb-close, .lb-prev, .lb-next {
    position: fixed; color: #fff; background: rgba(255,255,255,.12);
    border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; width: 44px; height: 44px;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover { background: rgba(255,255,255,.22); }
  .lb-close { top: 20px; right: 20px; }
  .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
  .lb-counter {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.7); font-size: 13px; letter-spacing: .04em;
  }
  .lb-title {
    position: fixed; top: 20px; left: 20px;
    color: rgba(255,255,255,.85); font-size: 14px; max-width: 60vw;
  }

  @media (max-width: 640px) {
    .lb-prev, .lb-next { width: 38px; height: 38px; font-size: 17px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="lb" id="lb" oncontextmenu="return false">
  <div class="lb-title" id="lbTitle"></div>
  <div class="lb-img" id="lbImg"></div>
  <button class="lb-prev" id="lbPrev">‹</button>
  <button class="lb-next" id="lbNext">›</button>
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
// 自动识别当前部署在哪个 GitHub Pages 仓库下（user.github.io/repo-name/），
// 这样别人 fork 这个仓库后不用改代码，直接用自己仓库里的 images/ 就行。
// 不在 *.github.io 域名下打开时（比如本地预览），用这两个兜底值。
const FALLBACK_OWNER = 'lijian316';
const FALLBACK_REPO = 'gallery';

function detectRepo() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return { owner: FALLBACK_OWNER, repo: FALLBACK_REPO };
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return { owner: m[1], repo: repo || FALLBACK_REPO };
}

const { owner: OWNER, repo: REPO } = detectRepo();
const DIR = 'images';
const IMG_EXT = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;

const $ = (id) => document.getElementById(id);
let photos = [];
let current = 0;

const TITLE_CELL = `
  <div class="cell title-cell">
    <div class="title-mark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <g stroke="#FFB300" stroke-width="6" stroke-linecap="round">
          <line x1="50" y1="6" x2="50" y2="18"/>
          <line x1="50" y1="82" x2="50" y2="94"/>
          <line x1="6" y1="50" x2="18" y2="50"/>
          <line x1="82" y1="50" x2="94" y2="50"/>
          <line x1="18.8" y1="18.8" x2="27" y2="27"/>
          <line x1="73" y1="73" x2="81.2" y2="81.2"/>
          <line x1="18.8" y1="81.2" x2="27" y2="73"/>
          <line x1="81.2" y1="18.8" x2="73" y2="27"/>
        </g>
        <circle cx="50" cy="50" r="27" fill="#FFC93C"/>
        <rect x="20" y="44" width="24" height="15" rx="7" fill="#1b1b1b"/>
        <rect x="56" y="44" width="24" height="15" rx="7" fill="#1b1b1b"/>
        <rect x="44" y="49" width="12" height="4" fill="#1b1b1b"/>
      </svg>
    </div>
    <div class="title-text">Sunny sun 作品集</div>
    <div class="title-text-en">Sunny Sun Portfolio</div>
  </div>
`;
const EMPTY_MSG = '';

function titleFromName(name) {
  return name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
}

async function loadImages() {
  const grid = $('grid');
  grid.innerHTML = TITLE_CELL;
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
    if (res.status === 404) {
      grid.innerHTML = TITLE_CELL + EMPTY_MSG;
      return;
    }
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    photos = (Array.isArray(data) ? data : [])
      .filter(f => f.type === 'file' && IMG_EXT.test(f.name))
      .sort((a, b) => a.name.localeCompare(b.name));

    if (!photos.length) {
      grid.innerHTML = TITLE_CELL + EMPTY_MSG;
      return;
    }

    grid.innerHTML = TITLE_CELL + photos.map((p, i) => `
      <div class="cell" data-i="${i}">
        <img src="${p.download_url}" alt="${titleFromName(p.name)}" loading="lazy" draggable="false" oncontextmenu="return false">
      </div>
    `).join('');

    grid.querySelectorAll('.cell[data-i]').forEach(cell => {
      cell.addEventListener('click', () => openLightbox(+cell.dataset.i));
    });
  } catch (e) {
    grid.innerHTML = TITLE_CELL + `<div class="cell state-cell">加载失败：${e.message}<br>可能是 GitHub API 请求过于频繁，稍后刷新重试。</div>`;
  }
}

function openLightbox(i) {
  current = i;
  renderLightbox();
  $('lb').classList.add('open');
}
function closeLightbox() { $('lb').classList.remove('open'); }
function renderLightbox() {
  const p = photos[current];
  $('lbImg').style.backgroundImage = `url('${p.download_url}')`;
  $('lbTitle').textContent = titleFromName(p.name);
  $('lbCounter').textContent = `${current + 1} / ${photos.length}`;
}
function nextPhoto() { current = (current + 1) % photos.length; renderLightbox(); }
function prevPhoto() { current = (current - 1 + photos.length) % photos.length; renderLightbox(); }

$('lbClose').addEventListener('click', closeLightbox);
$('lbNext').addEventListener('click', nextPhoto);
$('lbPrev').addEventListener('click', prevPhoto);
$('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') nextPhoto();
  if (e.key === 'ArrowLeft') prevPhoto();
});

loadImages();
</script>
</body>
</html>
